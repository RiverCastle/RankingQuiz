<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('RankingQuiz 관리', @{/css/admin.css})}"></head>

<body class="font-display min-h-screen bg-surface-base text-white overflow-x-hidden">

  <!-- Background effects -->
  <div class="fixed inset-0 bg-grid pointer-events-none"></div>
  <div class="fixed top-[-20%] left-[-10%] w-[500px] h-[500px] bg-neon-blue opacity-[0.06] rounded-full blur-[100px] pointer-events-none"></div>
  <div class="fixed bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-neon-purple opacity-[0.06] rounded-full blur-[100px] pointer-events-none"></div>

  <div class="relative z-10 flex flex-col min-h-screen max-w-lg mx-auto px-5 pb-10">

    <!-- Header -->
    <header class="pt-10 pb-6 flex items-center justify-between">
      <div>
        <p class="text-white/40 text-xs tracking-widest uppercase mb-1">Admin Panel</p>
        <h1 class="brand-font text-3xl leading-none">
          <span class="text-white">Ranking</span><span class="text-neon-blue neon-text">Quiz</span>
          <span class="text-white/60 text-xl ml-2">관리</span>
        </h1>
      </div>
      <a href="/" class="text-white/40 hover:text-white/70 text-sm transition-colors">← 홈</a>
    </header>

    <!-- 탭 네비게이션 -->
    <div id="adminContent" class="hidden">
      <div class="flex gap-2 mb-6">
        <button id="tab-home"
          class="admin-tab active flex-1 py-3 rounded-2xl text-sm font-bold tracking-wide transition-all duration-200">
          🏠 퀴즈 현황
        </button>
        <button id="tab-manage"
          class="admin-tab flex-1 py-3 rounded-2xl text-sm font-bold tracking-wide transition-all duration-200">
          📝 개별 퀴즈 관리
        </button>
        <button id="tab-bulk"
          class="admin-tab flex-1 py-3 rounded-2xl text-sm font-bold tracking-wide transition-all duration-200">
          📋 대량 등록
        </button>
      </div>

      <!-- ===== 탭 1: 퀴즈 현황 ===== -->
      <div id="panel-home">

        <p class="text-white/40 text-xs tracking-wider uppercase mb-4">퀴즈 활성화 상태</p>

        <!-- 단어 퀴즈 카드 -->
        <div class="card-glass rounded-3xl p-5 mb-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-2xl bg-neon-blue/10 border border-neon-blue/20 flex items-center justify-center text-2xl">
                📖
              </div>
              <div>
                <p class="font-bold text-base">단어 퀴즈</p>
                <p class="text-white/40 text-xs mt-0.5">ENG_VOCA</p>
              </div>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-ENG_VOCA" onchange="onToggleQuiz('ENG_VOCA', this.checked)" />
              <span class="toggle-slider toggle-blue"></span>
            </label>
          </div>
          <div class="mt-4 flex items-center gap-2">
            <span class="text-white/40 text-xs">현재 접속자</span>
            <span id="session-count-ENG_VOCA" class="text-neon-blue font-bold text-sm">-</span>
            <span class="text-white/40 text-xs">명</span>
          </div>
        </div>

        <!-- 성경 퀴즈 카드 -->
        <div class="card-glass rounded-3xl p-5 mb-6">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 rounded-2xl bg-neon-purple/10 border border-neon-purple/20 flex items-center justify-center text-2xl">
                ✝️
              </div>
              <div>
                <p class="font-bold text-base">성경 퀴즈</p>
                <p class="text-white/40 text-xs mt-0.5">BIBLE</p>
              </div>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-BIBLE" onchange="onToggleQuiz('BIBLE', this.checked)" />
              <span class="toggle-slider toggle-purple"></span>
            </label>
          </div>
          <div class="mt-4 flex items-center gap-2">
            <span class="text-white/40 text-xs">현재 접속자</span>
            <span id="session-count-BIBLE" class="text-neon-purple font-bold text-sm">-</span>
            <span class="text-white/40 text-xs">명</span>
          </div>
        </div>

        <!-- 토스트 메시지 -->
        <div id="statusToast" class="hidden card-glass rounded-2xl px-5 py-3 text-sm text-center text-white/80"></div>
      </div>

      <!-- ===== 탭 2: 개별 퀴즈 관리 ===== -->
      <div id="panel-manage" class="hidden">

        <p class="text-white/40 text-xs tracking-wider uppercase mb-4">개별 퀴즈 관리</p>

        <!-- 필터 및 검색 -->
        <div class="card-glass rounded-3xl p-5 mb-4">
          <div class="mb-3">
            <select id="manageCategory" onchange="onManageCategoryChange()"
              class="w-full bg-surface-base border border-white/10 rounded-xl px-4 py-3 text-white text-sm cursor-pointer transition-all duration-200">
              <option value="">전체 카테고리</option>
              <option value="ENG_VOCA">📖 단어 퀴즈 (ENG_VOCA)</option>
              <option value="BIBLE">✝️ 성경 퀴즈 (BIBLE)</option>
            </select>
          </div>
          <div class="flex gap-2">
            <input type="text" id="manageKeyword" placeholder="정답으로 검색..."
              class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/25 text-sm transition-all duration-200"
              onkeydown="if(event.key==='Enter') searchQuizList()" />
            <button onclick="searchQuizList()"
              class="btn-glow-blue bg-gradient-to-br from-neon-blue to-neon-blue-dark text-surface-base font-bold rounded-xl px-5 py-3 text-sm">
              검색
            </button>
          </div>
        </div>

        <!-- 퀴즈 목록 -->
        <div id="quizListContainer" class="space-y-2 mb-4">
          <div class="text-white/30 text-sm text-center py-8">탭을 선택하면 목록이 로드됩니다.</div>
        </div>

        <!-- 페이징 -->
        <div id="quizPagination" class="flex justify-center gap-2 mb-4"></div>

      </div>
      <!-- ===== 탭 3: 대량 등록 ===== -->
      <div id="panel-bulk" class="hidden">

        <p class="text-white/40 text-xs tracking-wider uppercase mb-4">퀴즈 대량 등록</p>

        <div class="card-glass rounded-3xl p-6 space-y-5">

          <!-- 카테고리 선택 -->
          <div>
            <label class="field-label" for="bulkCategory">카테고리</label>
            <select
              id="bulkCategory"
              class="neon-border w-full bg-surface-base border border-white/10 rounded-2xl px-5 py-4 text-white text-sm mt-2 transition-all duration-200 cursor-pointer"
            >
              <option value="ENG_VOCA">📖 단어 퀴즈 (ENG_VOCA)</option>
              <option value="BIBLE">✝️ 성경 퀴즈 (BIBLE)</option>
            </select>
          </div>

          <!-- 입력 형식 안내 -->
          <div class="bg-white/5 border border-white/10 rounded-2xl p-4 space-y-2">
            <p class="text-white/60 text-xs font-bold tracking-wide uppercase mb-2">입력 형식 안내</p>
            <p class="text-white/50 text-xs leading-relaxed">각 행: <span class="text-neon-blue font-mono">문제 [탭] 정답 [탭] 선택지JSON</span></p>
            <p class="text-white/50 text-xs leading-relaxed">선택지: <span class="text-white/70 font-mono">["보기1", "보기2", "보기3", "보기4"]</span> (짝수 개수)</p>
            <p class="text-white/40 text-xs leading-relaxed mt-1">예) <span class="font-mono">사과는 영어로?	apple	["apple", "banana", "cherry", "grape"]</span></p>
          </div>

          <!-- 텍스트 입력 영역 -->
          <div>
            <label class="field-label" for="bulkImportText">데이터 붙여넣기</label>
            <textarea
              id="bulkImportText"
              rows="10"
              placeholder="엑셀에서 복사한 데이터를 여기에 붙여넣으세요."
              class="neon-border w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white placeholder-white/25 text-xs font-mono resize-y mt-2 transition-all duration-200"
            ></textarea>
          </div>

          <!-- 등록 버튼 -->
          <button
            id="bulkSubmitBtn"
            onclick="submitBulkImport()"
            class="btn-glow-blue w-full bg-gradient-to-br from-neon-blue to-neon-blue-dark text-surface-base font-bold rounded-2xl py-4 text-sm tracking-wide"
          >
            대량 등록하기
          </button>

          <!-- 결과 영역 -->
          <div id="bulkResult" class="hidden space-y-2"></div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
  </div>

  <!-- ===== 수정 모달 ===== -->
  <div id="editModal" class="fixed inset-0 z-50 hidden flex items-end justify-center">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeEditModal()"></div>
    <div class="relative w-full max-w-lg bg-surface-base border border-white/10 rounded-t-3xl p-6 space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-bold text-base">퀴즈 수정</h3>
        <button onclick="closeEditModal()" class="text-white/40 hover:text-white/70 text-xl leading-none">✕</button>
      </div>

      <input type="hidden" id="editQuizId" />

      <div>
        <label class="field-label">카테고리</label>
        <input type="text" id="editCategory" readonly
          class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 text-white/50 text-sm mt-2 cursor-not-allowed" />
      </div>

      <div>
        <label class="field-label" for="editStatement">문제 내용</label>
        <textarea id="editStatement" rows="3" placeholder="문제를 입력하세요"
          class="neon-border w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white placeholder-white/25 text-sm resize-none mt-2 transition-all duration-200"></textarea>
      </div>

      <div>
        <label class="field-label" for="editAnswer">정답</label>
        <input type="text" id="editAnswer" placeholder="정답을 입력하세요"
          class="neon-border w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white placeholder-white/25 text-sm mt-2 transition-all duration-200" />
      </div>

      <div id="editOptionsSection" class="hidden">
        <label class="field-label">보기 (객관식)</label>
        <div id="editOptionsList" class="space-y-2 mt-2"></div>
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="closeEditModal()"
          class="flex-1 py-3 rounded-2xl border border-white/10 text-white/60 text-sm font-bold hover:border-white/30 transition-colors">
          취소
        </button>
        <button onclick="submitEditQuiz()"
          class="flex-1 btn-glow-blue bg-gradient-to-br from-neon-blue to-neon-blue-dark text-surface-base font-bold rounded-2xl py-3 text-sm">
          저장
        </button>
      </div>
      <div id="editResult" class="hidden text-center text-sm py-3 rounded-2xl"></div>
    </div>
  </div>

  <!-- ===== 삭제 확인 모달 ===== -->
  <div id="deleteModal" class="fixed inset-0 z-50 hidden flex items-center justify-center">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeDeleteModal()"></div>
    <div class="relative mx-5 w-full max-w-sm bg-surface-base border border-white/10 rounded-3xl p-6 space-y-4">
      <h3 class="font-bold text-base text-center">퀴즈 삭제</h3>
      <p class="text-white/60 text-sm text-center leading-relaxed" id="deleteConfirmText"></p>
      <input type="hidden" id="deleteQuizId" />
      <div class="flex gap-3">
        <button onclick="closeDeleteModal()"
          class="flex-1 py-3 rounded-2xl border border-white/10 text-white/60 text-sm font-bold hover:border-white/30 transition-colors">
          취소
        </button>
        <button onclick="confirmDeleteQuiz()"
          class="flex-1 py-3 rounded-2xl bg-red-500/20 border border-red-500/40 text-red-400 font-bold text-sm hover:bg-red-500/30 transition-colors">
          삭제
        </button>
      </div>
    </div>
  </div>

  <script th:src="@{/js/config.js}"></script>
  <script th:src="@{/js/admin.js}"></script>

</body>
</html>
