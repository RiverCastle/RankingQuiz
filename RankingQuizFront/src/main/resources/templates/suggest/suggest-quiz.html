<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('문제 제안하기', @{/css/admin.css})}"></head>

<body class="font-display min-h-screen bg-surface-base text-white overflow-x-hidden">

  <!-- Background effects -->
  <div class="fixed inset-0 bg-grid pointer-events-none"></div>
  <div class="fixed top-[-20%] left-[-10%] w-[500px] h-[500px] bg-neon-blue opacity-[0.06] rounded-full blur-[100px] pointer-events-none"></div>
  <div class="fixed bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-neon-purple opacity-[0.06] rounded-full blur-[100px] pointer-events-none"></div>

  <div class="relative z-10 flex flex-col min-h-screen max-w-lg mx-auto px-5 pb-10">

    <!-- Header -->
    <header class="pt-10 pb-6 flex items-center justify-between">
      <div>
        <p class="text-white/40 text-xs tracking-widest uppercase mb-1">Quiz Suggestion</p>
        <h1 class="brand-font text-3xl leading-none">
          <span class="text-white">문제</span><span class="text-neon-blue neon-text"> 제안하기</span>
        </h1>
      </div>
      <a href="/" class="text-white/40 hover:text-white/70 text-sm transition-colors">← 홈</a>
    </header>

    <!-- 안내 문구 -->
    <div class="card-glass rounded-3xl p-5 mb-6">
      <p class="text-white/60 text-sm leading-relaxed">
        직접 만든 문제를 제안해 주세요! 운영자 검토 후 실제 퀴즈에 반영됩니다.
        <br /><span class="text-white/40 text-xs mt-1 block">※ 정답은 반드시 보기 목록에 포함되어야 합니다.</span>
      </p>
    </div>

    <!-- 제안 폼 -->
    <div class="card-glass rounded-3xl p-6 space-y-5">

      <!-- 카테고리 -->
      <div>
        <label class="field-label">카테고리</label>
        <div class="grid grid-cols-2 gap-3 mt-2">
          <label class="radio-card" id="suggest-radio-ENG_VOCA">
            <input type="radio" name="suggest-category" value="ENG_VOCA" class="hidden" checked />
            <span class="text-lg">📖</span>
            <span class="text-sm font-bold">단어 퀴즈</span>
          </label>
          <label class="radio-card" id="suggest-radio-BIBLE">
            <input type="radio" name="suggest-category" value="BIBLE" class="hidden" />
            <span class="text-lg">✝️</span>
            <span class="text-sm font-bold">성경 퀴즈</span>
          </label>
        </div>
      </div>

      <!-- 문제 내용 -->
      <div>
        <label class="field-label" for="suggest-statement">문제 내용</label>
        <textarea
          id="suggest-statement"
          rows="3"
          placeholder="문제를 입력하세요"
          class="neon-border w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white placeholder-white/25 text-sm resize-none mt-2 transition-all duration-200"
        ></textarea>
      </div>

      <!-- 정답 -->
      <div>
        <label class="field-label" for="suggest-answer">정답</label>
        <input
          type="text"
          id="suggest-answer"
          placeholder="정답을 입력하세요 (보기 중 하나와 일치해야 합니다)"
          class="neon-border w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white placeholder-white/25 text-sm mt-2 transition-all duration-200"
        />
      </div>

      <!-- 보기 -->
      <div>
        <label class="field-label">보기</label>
        <div id="suggest-optionsList" class="space-y-2 mt-2">
          <input type="text" placeholder="보기 1" class="suggest-option neon-border w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 text-white placeholder-white/25 text-sm transition-all duration-200" />
          <input type="text" placeholder="보기 2" class="suggest-option neon-border w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 text-white placeholder-white/25 text-sm transition-all duration-200" />
          <input type="text" placeholder="보기 3" class="suggest-option neon-border w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 text-white placeholder-white/25 text-sm transition-all duration-200" />
          <input type="text" placeholder="보기 4" class="suggest-option neon-border w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 text-white placeholder-white/25 text-sm transition-all duration-200" />
        </div>
        <div class="flex gap-2 mt-2">
          <button onclick="addSuggestOption()" class="text-xs text-neon-blue/70 hover:text-neon-blue transition-colors px-3 py-1.5 rounded-xl border border-neon-blue/20 hover:border-neon-blue/50">+ 보기 추가</button>
          <button onclick="removeSuggestOption()" class="text-xs text-white/30 hover:text-white/60 transition-colors px-3 py-1.5 rounded-xl border border-white/10 hover:border-white/30">− 보기 제거</button>
        </div>
      </div>

      <!-- 제출 버튼 -->
      <button
        id="suggest-submitBtn"
        onclick="submitSuggestion()"
        class="btn-glow-blue w-full bg-gradient-to-br from-neon-blue to-neon-blue-dark text-surface-base font-bold rounded-2xl py-4 text-sm tracking-wide mt-2"
      >
        제안 제출하기
      </button>

      <!-- 결과 메시지 -->
      <div id="suggest-result" class="hidden text-center text-sm py-3 rounded-2xl"></div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
  </div>

  <script th:src="@{/js/config.js}"></script>
  <script th:src="@{/js/suggest-quiz.js}"></script>

</body>
</html>
